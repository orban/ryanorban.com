# Build, validate, and deploy ryanorban.com.
#
# Rules:
# - Pull requests BUILD and VALIDATE the full artifact but never deploy.
# - Pushes to master deploy after validation passes, through the `github-pages` environment.
# - `workflow_dispatch` on `master` with `deploy: true` redeploys without a new commit.
# - The validator runs after Hugo and before the artifact is uploaded. A green Hugo build is not
#   a green release.
# - A skipped deploy job still reports the run as "success". Check the job, not the run, when
#   confirming that something reached production.
name: Build, validate, and deploy Hugo site

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the validated artifact to GitHub Pages (master only)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Builds run per ref so a pull request or a bot push never displaces a queued deploy; only the
# deploy job holds the single "pages" slot.
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: "0.158.0"
  SITE_BASE_URL: "https://ryanorban.com/"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-sha: ${{ github.sha }}
    steps:
      - name: Install Hugo CLI
        env:
          HUGO_DEB_PATH: hugo.deb
        run: |
          wget --quiet --output-document "$HUGO_DEB_PATH" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg --install "$HUGO_DEB_PATH"
          hugo version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies (locked)
        run: npm ci

      - name: Resolve Hugo modules and verify lockfiles are unchanged
        run: |
          hugo mod tidy
          git diff --exit-code -- go.mod go.sum package-lock.json

      - name: Build production artifact
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo --cleanDestinationDir --minify --panicOnWarning --baseURL "$SITE_BASE_URL"

      - name: Write build.json
        run: |
          python3 - <<'PY'
          import json, os, datetime
          payload = {
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ.get("GITHUB_REF", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          with open("public/build.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Validate production artifact
        run: |
          python3 scripts/validate_site.py \
            --public public \
            --url-manifest scripts/baselines/public-urls.txt \
            --expected-sha "$GITHUB_SHA"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # Pushes to master deploy once the build job's validation passes. Manual workflow_dispatch with
    # `deploy: true` still works for redeploying master without a new commit. Pull requests never
    # deploy. The dispatch-only gate this replaces was added in 4eb98d3 to hold production while the
    # homepage redesign was in flight; the redesign landed in #10.
    if: >-
      github.ref == 'refs/heads/master'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
      )
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout (for the live validator)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the Cloudflare-fronted site
        run: |
          python3 scripts/validate_live.py \
            --base-url https://ryanorban.com \
            --expected-sha "$GITHUB_SHA" \
            --url-manifest scripts/baselines/public-urls.txt \
            --wait-seconds 300

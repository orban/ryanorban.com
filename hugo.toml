baseURL = "https://ryanorban.com/"
languageCode = "en-us"
title = "Ryan Orban"
copyright = "Ryan Orban"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/michenriksen/hugo-theme-til"

# Agent-facing plain-text surfaces. GitHub Pages serves static files and cannot branch
# on an Accept header, so content negotiation is impossible here; these are the static
# equivalent that llmstxt.org actually specifies.
[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  # /llms.txt — the agent-facing index (llmstxt.org). Home only.
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  # /posts/<slug>/index.md — the essay as clean markdown beside its HTML.
  # notAlternative keeps it out of <head>, so the audited HTML is untouched; /llms.txt
  # is what points agents at these, which is the arrangement the spec describes.
  [outputFormats.markdown]
    mediaType = "text/markdown"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "llms"]
  section = ["HTML", "RSS", "JSON"]
  page = ["HTML", "markdown"]

[menus]
  [[menus.main]]
    name = "Work"
    url = "/#work"
    weight = 10
  [[menus.main]]
    name = "Writing"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    name = "Bookmarks"
    pageRef = "/notes"
    weight = 25
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 30
  [[menus.main]]
    name = "Contact"
    url = "/#contact"
    weight = 40

[params]
  dateFormat = ":date_long"
  showGraph = true

  [params.author]
    name = "Ryan Orban"
    email = "me@ryanorban.com"

  [params.home]
    showRecentPosts = false
    showRecentNotes = false

  [params.footer]
    creativeCommonsLicense = "none"
    showThemeCredit = true

  [params.plausible]
    enable = true
    host = "https://plausible.srv.ryo.wtf"
    domain = "ryanorban.com"

  # No [params.robotsTxt] block: layouts/robots.txt shadows the theme's template and
  # owns the crawler policy outright, so the theme's blockAI / blockCC flags would be
  # read by nothing. Change the policy there, not here.

[markup]
  [markup.highlight]
    style = "tokyonight-night"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        inline = [['$', '$']]
        block = [['$$', '$$']]
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true

# The homepage carries its design direction contract as an HTML comment that must survive
# the production build (scripts/audit_homepage.py checks for it).
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = true

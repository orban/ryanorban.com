# Provider matrix for robots.txt.
#
# scripts/validate_site.py reads this file and asserts that the generated robots.txt
# agrees with it at whichever stage the "# crawler-policy-stage:" marker in
# layouts/robots.txt names. Change policy here and in that template together; the
# validator fails if they disagree.
#
# Policies:
#   allow              full access
#   deny               Disallow: /
#   publication-paths  allowed on publicationPaths, disallowed on rawPaths
#
# An agent may also leave scripts/baselines/robots-denied-agents.txt without a
# baseline edit if its role begins "automatic answer retrieval" and it reaches
# publication-paths at the active stage — that exemption is the mechanism this file
# exists for. Training crawlers do not qualify and were removed from the baseline by
# explicit decision on 2026-09-18.

publicationPaths = ["/", "/about/", "/posts/"]
rawPaths = ["/notes/"]

[stages]
baseline = "2026-08-18 origin posture: every AI agent denied outright."
cite-and-train = "2026-09-18: answer engines and training crawlers may read the publication surface. The raw archive stays out of both."

# --- automatic answer retrieval ------------------------------------------------
# Still listed in the denial baseline; reopened through the role exemption above.

[[agents]]
agent = "OAI-SearchBot"
role = "automatic answer retrieval for ChatGPT search"
policy = { baseline = "deny", cite-and-train = "publication-paths" }

[[agents]]
agent = "ChatGPT-User"
role = "automatic answer retrieval, user-triggered fetch"
policy = { baseline = "deny", cite-and-train = "publication-paths" }

[[agents]]
agent = "PerplexityBot"
role = "automatic answer retrieval for Perplexity"
policy = { baseline = "deny", cite-and-train = "publication-paths" }

[[agents]]
agent = "Claude-Web"
role = "automatic answer retrieval, user-triggered fetch"
policy = { baseline = "deny", cite-and-train = "publication-paths" }

[[agents]]
agent = "Meta-ExternalFetcher"
role = "automatic answer retrieval, user-triggered fetch"
policy = { baseline = "deny", cite-and-train = "publication-paths" }

# --- training corpora ---------------------------------------------------------
# Removed from the denial baseline on 2026-09-18 so that future models can learn the
# positioning. Same path split as retrieval: the publication surface, not the archive.


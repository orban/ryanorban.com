# --- search and link preview --------------------------------------------------
# Neither is an AI crawler. Both were collateral damage of the blanket block and were
# removed from the baseline on 2026-09-18: Applebot is Siri and Spotlight search, which
# the declared search=yes signal contradicts blocking, and facebookexternalhit is what
# renders the og:image card when a link is shared.

[[agents]]
agent = "Applebot"
role = "search index for Siri and Spotlight"
policy = { baseline = "deny", cite-and-train = "allow" }

[[agents]]
agent = "facebookexternalhit"
role = "link preview card generation"
policy = { baseline = "deny", cite-and-train = "allow" }

